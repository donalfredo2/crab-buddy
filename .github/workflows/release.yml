name: release

# A version tag publishes its GitHub Release, with the notes from CHANGELOG.md. The marketplace serves main,
# so users already have the version once it's merged; the Release is the record and the notification.
on:
  push:
    tags: ['v*']
    # A merge to main that changes plugin.json releases its version, if that version has no tag yet: tag and
    # Release follow the merge without anyone pushing a tag. (Path filters don't apply to tag pushes.)
    branches: [main]
    paths: ['.claude-plugin/plugin.json']
  # By hand: for a tag that is already pushed (a re-run updates the notes), or, run from main, for a version
  # not tagged yet: the workflow then tags main itself. For sessions that can't push tags.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish, e.g. v0.24.0'
        required: true

# This job can write to the repository, so its actions are pinned to a commit, with the version beside it: a tag
# can be moved, a commit can't. Dependabot (.github/dependabot.yml) moves both.
permissions:
  contents: write

# Two merges in a row release one after the other, never side by side.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Through env, never pasted into a script: a tag name is text anyone with push access chose.
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On a merge to main the tag comes from plugin.json. A version that is already tagged was released
      # before (plugin.json changed for another reason), so the rest is skipped.
      - name: Take the tag from plugin.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::plugin.json version is not semver: $version"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      # A tag that exists is published as it is. A new one only from main, at the commit checked out.
      - name: Pick the commit to release
        if: env.SKIP != '1'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "refs/tags/$TAG"
            echo "NEW_TAG=" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "NEW_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          else
            echo "::error::$TAG does not exist. Run this from main to tag main, or push the tag first."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SKIP != '1'
        with:
          node-version: 22
      # Fails unless the tag is plugin.json's version and the changelog has its entry.
      - if: env.SKIP != '1'
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create the release, or update its notes
        if: env.SKIP != '1'
        run: |
          title="crab-buddy ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          elif [ -n "$NEW_TAG" ]; then
            gh release create "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --target "$NEW_TAG"
          else
            gh release create "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
