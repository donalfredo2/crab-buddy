name: test

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a Claude Code release that breaks the crab shows up even in a week with no pushes.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned so a new Claude Code release can't turn CI red on its own. Bump on purpose.
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - run: claude plugin validate .
      - name: hooks/news.ts has the version plugin.json gives
        run: |
          node -e '
            const v = require("./.claude-plugin/plugin.json").version
            const src = require("fs").readFileSync("hooks/news.ts", "utf8")
            if (!src.includes(`export const VERSION = ${JSON.stringify(v).replace(/"/g, "\x27")}`)) {
              console.error(`hooks/news.ts VERSION is not ${v}: bump it with plugin.json`)
              process.exit(1)
            }
            console.log(`VERSION ${v} matches`)
          '
      - run: claude plugin test .

  # The canary: the same checks on the newest Claude Code. It never blocks a merge; when it goes red while the
  # pinned job above stays green, a new release changed something the crab relies on, before users find out.
  latest:
    name: validate and test (latest Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .

  animations:
    name: animation check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned so the cache key holds. Bump on purpose.
      BUN_VERSION: 1.4.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Bun from the cache, else from npm (Bun's own @oven/bun-linux-x64 package, integrity-checked by npm pack).
      # Not from GitHub's release downloads, which setup-bun uses: they have answered 504 for a while at a time
      # and failed the job before any check ran.
      - name: Cache Bun
        id: bun-cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}
      - name: Install Bun from npm
        if: steps.bun-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          npm pack --silent "@oven/bun-linux-x64@$BUN_VERSION"
          tar xzf "oven-bun-linux-x64-$BUN_VERSION.tgz"
          mkdir -p ~/.bun/bin
          install -m 755 package/bin/bun ~/.bun/bin/bun
      - run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun --version
      # The script imports playwright; there is no package.json, so install it without one.
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bun scripts/check-animations.ts
