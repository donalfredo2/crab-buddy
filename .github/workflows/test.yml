name: test

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a Claude Code release that breaks the crab shows up even in a week with no pushes.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit, with the version beside it: a tag can be moved, a commit can't. Dependabot
# (.github/dependabot.yml) moves both.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Pinned so a new Claude Code release can't turn CI red on its own. Bump on purpose.
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: claude plugin validate . (type errors fail)
        run: scripts/validate.sh
      - name: hooks/news.ts has the version plugin.json gives
        run: |
          node -e '
            const v = require("./.claude-plugin/plugin.json").version
            const src = require("fs").readFileSync("hooks/news.ts", "utf8")
            if (!src.includes(`export const VERSION = ${JSON.stringify(v).replace(/"/g, "\x27")}`)) {
              console.error(`hooks/news.ts VERSION is not ${v}: bump it with plugin.json`)
              process.exit(1)
            }
            console.log(`VERSION ${v} matches`)
          '
      - run: claude plugin test .

  # The canary: the same checks on the newest Claude Code. It never blocks a merge; when it goes red while the
  # pinned job above stays green, a new release changed something the crab relies on, before users find out.
  latest:
    name: validate and test (latest Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: claude --version
      # validate passes "with warnings" on a type error, so a release that changes a type the crab or its tests
      # use would leave this canary green: the script fails on one.
      - name: claude plugin validate . (type errors fail)
        run: scripts/validate.sh
      - run: claude plugin test .

  animations:
    name: animation check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned so the cache key holds. Bump on purpose.
      BUN_VERSION: 1.4.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Bun from the cache, else from npm (Bun's own @oven/bun-linux-x64 package, integrity-checked by npm pack).
      # Not from GitHub's release downloads, which setup-bun uses: they have answered 504 for a while at a time
      # and failed the job before any check ran.
      - name: Cache Bun
        id: bun-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}
      - name: Install Bun from npm
        if: steps.bun-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          npm pack --silent "@oven/bun-linux-x64@$BUN_VERSION"
          tar xzf "oven-bun-linux-x64-$BUN_VERSION.tgz"
          mkdir -p ~/.bun/bin
          install -m 755 package/bin/bun ~/.bun/bin/bun
      - run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun --version
      # The script imports playwright; there is no package.json, so install it without one.
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      # --with-deps adds fonts and libraries through apt. When Ubuntu's mirrors don't answer (they have failed
      # to resolve for a while at a time), take the browser alone from Playwright's CDN: the runner image has
      # Chrome's libraries, and the check compares pictures for movement, never text, so no fonts are needed.
      # apt retries an unresolvable mirror for longer than the job may run, so its attempt gets 4 minutes.
      - name: Install Chromium
        run: timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: bun scripts/check-animations.ts
